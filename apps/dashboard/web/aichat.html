<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="/static/badge.png" type="image/png">
<title>SkillFishOS AI Chat</title>
<style>
  :root{--bg:#0d0b06;--panel:#1a140b;--gold:#d8a849;--gold-lt:#e8c878;--cream:#efe6d3;--muted:#a9967a;--line:rgba(216,168,73,.2)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--cream);display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header b{color:var(--gold-lt)}
  select{background:#241b10;color:var(--gold-lt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:.85rem}
  #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .m{max-width:80%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5;font-size:.95rem}
  .u{align-self:flex-end;background:linear-gradient(135deg,#e8c878,#d8a849);color:#1a130a}
  .a{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .sys{align-self:center;color:var(--muted);font-size:.85rem}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;background:#0d0b06;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:.95rem;height:46px}
  button{background:linear-gradient(135deg,#e8c878,#d8a849 55%,#b9722f);color:#1a130a;border:none;border-radius:10px;padding:0 18px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #rete{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:.85rem;color:var(--muted);flex-wrap:wrap}
  #rete code{background:#0d0b06;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--gold-lt);user-select:all}
  #rete label{display:flex;align-items:center;gap:6px;color:var(--cream);cursor:pointer}
  #rete .nota{color:#d8956a}
</style></head>
<body>
<header><b>🧠 SkillFishOS AI</b><span style="flex:1"></span><span style="color:var(--muted);font-size:.8rem" data-i18n="a_model">model</span><select id="model"></select></header>
<div id="rete">
  <label><input type="checkbox" id="lan"/>
    <span data-i18n="a_lan">Reachable from the local network</span></label>
  <span data-i18n="a_lan_addr">Address</span> <code id="indirizzo">—</code>
  <span style="flex:1"></span>
  <button id="modo" type="button" style="padding:5px 12px;font-size:.8rem" data-i18n="a_mode_on">Free RAM: shut the desktop</button>
  <span id="ram" style="color:var(--muted)"></span>
  <span class="nota" id="avviso" hidden data-i18n="a_lan_warn">Open on the network anyone at home can use this GPU: keep it off on networks that are not yours.</span>
</div>
<div id="log"><div class="m sys" data-i18n="a_intro">Ask the local model something. It runs on the BC-250 GPU, no cloud.</div></div>
<form id="f"><textarea id="q" placeholder="Scrivi un messaggio…  (Invio per inviare)"></textarea><button id="send" type="submit" data-i18n="a_send">Send</button></form>
<script src="/static/i18n.js"></script>
<script>
  const $ = s => document.querySelector(s);

  // La rete: si legge com'e' adesso, e la casella la cambia.
  // ⚠️ L'indirizzo lo dice il demone, non si indovina dal browser: chi guarda
  // la pagina puo' arrivarci da un nome, da ZeroTier o da un inoltro di porta,
  // e quello che serve incollare in un editor e' l'indirizzo della SCHEDA.
  async function reteLeggi() {
    try {
      const r = await (await fetch("/api/ai/conf", { credentials: "same-origin" })).json();
      $("#lan").checked = !!r.lan;
      $("#indirizzo").textContent = r.indirizzo || ("http://127.0.0.1:" + (r.porta || 8888));
      $("#avviso").hidden = !r.lan;
    } catch (e) { /* il motore puo' essere spento: non e' un errore da urlare */ }
  }
  $("#lan").addEventListener("change", async () => {
    const acceso = $("#lan").checked;
    $("#lan").disabled = true;
    try {
      await fetch("/api/ai/conf", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lan: acceso })
      });
    } finally { $("#lan").disabled = false; reteLeggi(); }
  });

  // La modalita' AI: il desktop si spegne e la memoria va al modello.
  // ⚠️ Da qui si fa soprattutto il RITORNO: con il desktop spento il Control
  // Center sulla scheda non esiste piu', e questa pagina e' l'unica strada che
  // non passa da ssh.
  let modoAttivo = false;
  function modoMostra(r) {
    modoAttivo = !!r.attiva;
    const b = $("#modo");
    b.textContent = sfT(modoAttivo ? "a_mode_off" : "a_mode_on");
    $("#ram").textContent = r.ram_disponibile_mb
      ? sfT("a_mode_ram") + " " + r.ram_disponibile_mb + " / " + r.ram_totale_mb + " MB" : "";
  }
  async function modoLeggi() {
    try { modoMostra(await (await fetch("/api/ai/mode", { credentials: "same-origin" })).json()); }
    catch (e) { /* il modulo AI puo' essere spento */ }
  }
  $("#modo").addEventListener("click", async () => {
    if (!modoAttivo && !confirm(sfT("a_mode_ask"))) return;
    $("#modo").disabled = true;
    try {
      const r = await (await fetch("/api/ai/mode", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ azione: modoAttivo ? "off" : "on" })
      })).json();
      modoMostra(r);
    } finally { $("#modo").disabled = false; }
  });
  modoLeggi();
  setInterval(modoLeggi, 15000);
  reteLeggi();
  const log = $("#log"); const msgs = [];
  const add = (role, text) => { const d = document.createElement("div"); d.className = "m " + (role === "user" ? "u" : role === "assistant" ? "a" : "sys"); d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
  (async () => { try { const s = await (await fetch("/api/ai", { credentials: "same-origin" })).json();
    (s.models || []).forEach(m => { const o = document.createElement("option"); o.value = o.textContent = m; $("#model").appendChild(o); });
    if (!(s.models || []).length) add("system", sfT("p_nomodel"));
  } catch (e) {} })();
  $("#f").addEventListener("submit", async e => {
    e.preventDefault(); const q = $("#q").value.trim(); if (!q) return;
    $("#q").value = ""; add("user", q); msgs.push({ role: "user", content: q });
    $("#send").disabled = true; const wait = add("assistant", "…");
    try {
      const r = await (await fetch("/api/ai/chat", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: $("#model").value, messages: msgs }) })).json();
      if (r.ok) { wait.textContent = r.message || "(vuoto)"; msgs.push({ role: "assistant", content: r.message || "" }); }
      else { wait.textContent = "⚠ " + (r.error || "errore"); }
    } catch (e) { wait.textContent = "⚠ errore di rete"; }
    $("#send").disabled = false; $("#q").focus();
  });
  $("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#f").requestSubmit(); } });
</script>
</body></html>
