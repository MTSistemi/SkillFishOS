<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="/static/badge.png" type="image/png">
<title>SkillFishOS Telemetria</title>
<!--
  SkillFishOS Telemetria, a schermo intero.

  ⚠️ QUESTA PAGINA NON DISEGNA NIENTE DI SUO. Grafici, barre per core e scala
  degli assi stanno in telem.js, che carica anche la dashboard: sono lo stesso
  codice, non due copie. Copiarlo qui sarebbe stata la strada corta e avrebbe
  fatto divergere le due viste al primo ritocco, che in questo progetto e' gia'
  successo con gli elenchi dei moduli.

  I dati arrivano da /api/telemetry, lo stesso flusso della scheda nella
  dashboard: nessun secondo lettore dei sensori.

  La disposizione e' quella della scheda, ma larga: i grafici in griglia e le
  barre per core sotto, cosi' chi conosce la dashboard sa gia' dov'e' cosa.
-->
<style>
  :root{--bg:#0d0b06;--panel:#1a140b;--gold:#d8a849;--gold-lt:#e8c878;--copper:#b9722f;
        --cream:#efe6d3;--muted:#a9967a;--line:rgba(216,168,73,.2)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--cream);
       height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  header b{color:var(--gold-lt);font-size:1.05rem}
  .sp{flex:1}
  .pill{font-size:.72rem;color:#0d0b06;background:var(--gold);border-radius:9px;padding:1px 8px}
  .pill.off{background:#6b5a34;color:#efe6d3}
  main{flex:1;overflow:auto;padding:12px 14px 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .chart canvas{width:100%;height:150px;display:block}
  .lab{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:4px;gap:10px}
  .lab b{color:var(--cream)}
  .cores{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  /* ⚠️ Queste regole sono le stesse di index.html, e devono restarlo: il
     disegno lo fa renderCores() in telem.js per tutte e due le pagine. La
     versione che stava qui prima era scritta a mano e diversa, e le barre non
     si vedevano affatto: le etichette dell'asse si accavallavano tutte nello
     stesso punto (senza `.cat{position:relative}`) e le barre venivano alte
     zero, perche' una percentuale dentro un flex senza altezza non ha di cosa
     essere percentuale. */
  .cwrap{position:relative;display:flex;gap:6px;height:190px;margin-top:4px}
  .cgrid{position:absolute;left:40px;right:0;top:14px;bottom:14px;pointer-events:none;
    border-bottom:1px solid rgba(216,168,73,.18);
    background:repeating-linear-gradient(to bottom,rgba(216,168,73,.10) 0 1px,transparent 1px 25%)}
  .cax{width:34px;display:grid;grid-template-rows:14px 1fr 14px}
  .cat{position:relative}
  .cat span{position:absolute;right:0;transform:translateY(-50%);font:.58rem 'DejaVu Sans Mono',monospace;color:rgba(185,160,122,.8)}
  .cbars{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;min-width:0}
  .cbar{display:grid;grid-template-rows:14px 1fr 14px;min-width:0}
  .cbar .v{font:700 .58rem 'DejaVu Sans Mono',monospace;color:var(--gold-lt);text-align:center;line-height:14px;
    overflow:hidden;white-space:nowrap}
  .cbar .t{position:relative}
  .cbar .b{position:absolute;left:0;right:0;bottom:0;border-radius:3px 3px 0 0;min-height:2px;transition:height .25s linear}
  .cbar .n{font:.56rem 'DejaVu Sans Mono',monospace;color:var(--muted);text-align:center;line-height:14px;
    overflow:hidden;white-space:nowrap}
  .cbar.off .b{background:none!important;border:1px dashed rgba(216,168,73,.35);height:12px!important}
  .cbar.off .v{color:rgba(185,160,122,.45)}
  .vuoto{color:var(--muted);padding:18px;text-align:center}
  /* La scheda memoria e il riquadro sicurezza: stessa disposizione della finestra
     del Monitor, perche' chi impara una delle due sa gia' usare l'altra. Tessere
     a sinistra come legenda e valore insieme, UN grafico solo a destra. */
  .card{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .card h3{font-size:.84rem;color:var(--gold);font-weight:700;letter-spacing:.5px;margin-bottom:7px}
  .memrow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
  .tess{display:flex;flex-direction:column;gap:4px;min-width:132px}
  .tess button{text-align:left;padding:4px 8px;border-radius:7px;cursor:pointer;
    font:700 .68rem 'DejaVu Sans Mono',monospace;background:rgba(216,168,73,.12);
    border:1px solid currentColor}
  .tess button.off{color:#6b5a34!important;background:rgba(216,168,73,.03)}
  /* Il disegno e' piu' alto che largo da quando e' ritagliato sulla memoria:
     sta in colonna accanto alle tessere, non in una fascia sopra a tutto. */
  .memboard{flex:0 0 268px;max-width:268px}
  .memboard canvas{width:100%;display:block;border-radius:8px}
  .memchart{flex:1;min-width:280px}
  .memchart canvas{width:100%;height:210px;display:block}
  .memfoot{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .memfoot button{padding:4px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.76rem;
    color:var(--muted);background:rgba(216,168,73,.12);border:1px solid var(--line)}
  .memfoot button:disabled{color:#6b5a34;cursor:default;border-color:rgba(216,168,73,.1)}
  .memnota{color:var(--muted);font-size:.72rem;flex:1}
  .riass{color:var(--muted);font:.68rem 'DejaVu Sans Mono',monospace;white-space:pre-line;margin-top:5px}
  /* Oro se il fatto vale, ottone spento se non vale. Niente rosso e niente verde:
     nessuna di queste righe e' un guasto, e colorarle da allarme direbbe a chi
     legge una cosa falsa sulla sua scheda. */
  .sec{display:grid;grid-template-columns:auto auto 1fr;gap:3px 12px;align-items:center}
  .sec .dot{font-size:.7rem}
  .sec .on{color:var(--gold)} .sec .no{color:#6b5a34}
  .sec .nome{font-size:.76rem;color:var(--cream)}
  .sec .senso{font-size:.76rem;color:var(--muted)}
</style></head>
<body>
<header>
  <b>📊 SkillFishOS · <span id="tit">Telemetria</span></b>
  <span class="pill" id="live">live</span>
  <span class="sp"></span>
  <span id="host" style="color:var(--muted);font-size:.8rem"></span>
</header>
<main>
  <div class="grid" id="grafici"></div>
  <div class="cores" id="cores">
    <div class="lab"><span id="lab-core">Frequenza per core (MHz)</span><span class="cstat"></span></div>
    <div class="cwrap"><div class="cax"><i></i><div class="cat"></div><i></i></div>
      <div class="cgrid"></div><div class="cbars"></div></div>
  </div>
  <div class="card" id="mem" style="display:none">
    <h3 id="mem-tit">Memoria GDDR6</h3>
    <div class="memrow">
      <div class="memboard"><canvas id="mem-board"></canvas></div>
      <div class="tess" id="mem-tess"></div>
      <div class="memchart"><canvas id="mem-cv"></canvas><div class="riass" id="mem-riass"></div></div>
    </div>
    <div class="memfoot">
      <button id="mem-btn"></button><span class="memnota" id="mem-nota"></span>
    </div>
  </div>
  <div class="card" id="sic" style="display:none">
    <h3><span id="sic-tit">Stato di sicurezza della piattaforma</span>
        <span id="sic-bl" style="float:right;color:var(--muted);font-weight:400"></span></h3>
    <div class="sec" id="sic-righe"></div>
  </div>
  <div class="vuoto" id="vuoto" style="display:none"></div>
</main>

<!-- ⚠️ `$` va definito PRIMA di telem.js, che lo usa dentro renderCores. E in
     app.js e' un `const`: qui non si carica app.js proprio per non trovarsi due
     dichiarazioni dello stesso nome. -->
<script>
  const $ = (s, r = document) => r.querySelector(s);
</script>
<script src="/static/telem.js"></script>
<script>
(() => {
  // Le etichette: si prendono dal dizionario condiviso, lo stesso che usa la
  // dashboard, cosi' questa pagina parla la lingua dell'utente senza avere un
  // suo elenco di traduzioni da tenere allineato.
  // ⚠️ Se il dizionario non risponde si resta in inglese, non in italiano:
  // e' la regola del progetto per ogni ripiego.
  let VOCI = {};

  // ⚠️ Il dizionario condiviso e' indicizzato per stringa INGLESE, non per
  // chiave simbolica: chiedergli "t_temp" non poteva funzionare, e infatti la
  // pagina mostrava t_temp, t_load, t_freq. Le chiavi che usa telem.js si
  // traducono qui nella stringa inglese corrispondente, e quella si cerca.
  const INGLESE = {
    t_temp: "Temperature", t_load: "Load", t_freq: "Frequency",
    t_pow: "Power", t_volt: "Voltage", t_fan: "Fan",
    t_percore: "Per core/thread frequency", m_telem: "Telemetry",
    c_off: "off", c_avg: "avg", c_online: "online",
    mem_tit: "GDDR6 memory", mem_go: "Read the memory", mem_stop: "Stop reading",
    mem_since: "reading for %s",
    mem_idle: "the reading is started when needed",
    mem_avg: "average %s °C", mem_hot: "hotspot %s °C (chip %s)",
    sic_tit: "Platform security state", x_fail: "failed",
  };
  const T = (k, rip) => {
    const en = INGLESE[k] || rip || k;
    return VOCI[en] || en;
  };

  const box = $("#grafici"), grafici = [];
  function costruisci() {
    box.innerHTML = "";
    grafici.length = 0;
    TELEM.forEach(spec => {
      const el = document.createElement("div");
      el.className = "chart";
      const etichette = spec.s.map(s =>
        `<span style="color:${s.c}">${s.l} <b data-k="${s.k}">–</b></span>`).join(" ");
      el.innerHTML = `<div class="lab"><span>${T(spec.t)} (${spec.u})</span>` +
                     `<span>${etichette}</span></div><canvas></canvas>`;
      box.appendChild(el);
      grafici.push({ spec, m: new Mini($("canvas", el), spec.s), el });
    });
  }

  function collega() {
    const es = new EventSource("/api/telemetry");
    es.onopen = () => { $("#live").classList.remove("off"); $("#live").textContent = T("live", "live"); };
    es.onerror = () => {
      // Non si nasconde la caduta: un grafico fermo che sembra vivo e' peggio
      // di uno che dice «fermo». Il browser riprova da solo.
      $("#live").classList.add("off");
      $("#live").textContent = T("x_off", "fermo");
    };
    es.onmessage = ev => {
      let v; try { v = JSON.parse(ev.data); } catch (e) { return; }
      try { renderCores($("#cores"), v.cpu_threads); } catch (e) {}
      grafici.forEach(g => {
        g.m.push(g.spec.s.map(s => v[s.k]));
        g.spec.s.forEach(s => {
          const b = g.el.querySelector(`[data-k="${s.k}"]`);
          if (b && v[s.k] != null) b.textContent = Math.abs(v[s.k]) >= 10
            ? Math.round(v[s.k]) : v[s.k].toFixed(2);
        });
      });
    };
  }

  fetch("/api/i18n?lang=" + encodeURIComponent((navigator.language || "en").slice(0, 2)))
    .then(r => r.json()).then(d => { VOCI = (d && d.voci) || {}; })
    .catch(() => {})
    .then(() => {
      document.title = "SkillFishOS " + T("m_telem", "Telemetry");
      $("#tit").textContent = T("m_telem", "Telemetry");
      $("#lab-core").textContent = T("t_percore", "Per-core frequency") + " (MHz)";
      costruisci();
      collega();
      $("#mem-tit").textContent = T("mem_tit", "GDDR6 memory") + " (°C)";
      memCostruisci();
      memGiro();
      // Il collettore pubblica ogni tre secondi: chiedere piu' spesso ripete gli
      // stessi numeri, e l'intervallo non e' nostro da accorciare.
      setInterval(memGiro, 3000);
      sicCarica();
    });

  // ---- scheda memoria GDDR6 e stato di sicurezza -------------------------
  // ⚠️ QUESTA PAGINA NON COMANDA NIENTE DA SOLA. Chi accende e spegne la lettura
  // e' skillfish-gddr6-helper, e il demone e' l'unico che lo chiama: da qui si
  // mostra cio' che il demone pubblica e si chiede a lui di accendere o
  // spegnere. Il tetto di dieci minuti e la pausa fra una lettura e l'altra che
  // stavano nell'helper non ci sono piu': servivano a stare alla larga da un
  // guasto del payload SMU che adesso e' corretto (attese contate, vedi
  // payload/main.c e UPSTREAM.md).
  const MEMCOL = ["#e8c878","#d8a849","#c98a3a","#e07b39","#e0d24f","#9bd24f","#5fd24f","#49b6e0"];
  const SICRIGHE = [
    ["fused_part",           "Silicon",         "production part, fuses blown",   "pre-production sample"],
    ["debug_lock_on",        "Debug",           "locked",                         "open"],
    ["boot_integrity",       "Boot integrity",  "verified",                       "not verified"],
    ["tsme_status",          "Memory",          "encrypted by firmware",          "in the clear, no performance cost"],
    ["hsp_tpm_available",    "Firmware TPM",    "present",                        "absent"],
    ["rom_armor_enforced",   "BIOS flash",      "guarded by the secure processor","not guarded"],
    ["anti_rollback_status", "Older firmware",  "blocked",                        "allowed"],
    ["rpmc_spirom_available","Rollback counter","present on the flash",           "absent"],
  ];
  // ---------------- il disegno della scheda ----------------
  // Posizioni misurate, non disegnate a occhio: vengono da
  // ASRock_AMD_BC-250_ISL_X5R_r1.00.cad, il boardview GenCAD 1.4 della scheda
  // vera pubblicato su bc-250.com, 2163 componenti su un PCB di 304,66 x 139,98
  // mm. E' la stessa pianta della classe DisegnoScheda nel Control Center: chi
  // guarda la finestra e chi guarda il browser deve vedere la stessa scheda.
  //
  // ⚠️ LA MEMORIA STA DIETRO, L'APU DAVANTI. U25 e' LAYER TOP, U27..U43 sono
  // tutti LAYER BOTTOM. Il lato di un pezzo sta nel blocco $COMPONENTS del CAD;
  // il campo layer di un PIN dentro $SHAPES dice TOP per quasi tutto e vuol dire
  // un'altra cosa. Leggendo quello i nove chip finivano sulla stessa faccia, e
  // il disegno ha mostrato una scheda inesistente finche' Mattia non ha guardato
  // quella vera.
  //
  // ⚠️ Quindi questa e' la faccia di SOTTO e la x va specchiata: x schermo =
  // LARGO - x. Le coordinate qui sono quelle della scheda, non specchiate, e lo
  // specchio lo fa px() una volta sola per tutto. Una vista del retro che si
  // dimentica lo specchio e' il davanti con sopra i pezzi sbagliati, e sembra
  // perfetta. Le y sono gia' ribaltate (GenCAD ha la y che sale, il canvas no).
  //
  // ⚠️ U27, U33, U37 e U43 stanno a 45 gradi ai quattro angoli diagonali del
  // die. Nel CAD si vede dal campo pin, quadrato da 15,9 mm contro 9,8 x 12,7
  // dei dritti, e (9,8 + 12,7) / radice(2) fa 15,9 preciso.
  //
  // ⚠️ QUALE SENSORE SIA QUALE CHIP RESTA IGNOTO. Le otto posizioni sono vere,
  // l'ordine in cui la SMU risponde non lo documenta nessuno. Percio' ogni chip
  // porta il suo numero e il bordo del colore della sua linea nel grafico.
  // ⚠️ LA SCHEDA INTERA E' QUASI TUTTA VUOTA. Il PCB e' 304,66 x 139,98 mm e
  // tutti e otto i chip stanno dentro una finestra di circa 95 x 112 mm intorno
  // all'APU: disegnata da bordo a bordo, meta' del quadro era verde spoglio e
  // ogni chip veniva venti pixel. Si disegna quella finestra. I bordi alto e
  // basso della scheda ci sono ancora dentro, quindi resta un pezzo di scheda
  // vera e non uno schema, e tutto il resto esce dai lati.
  // ⚠️ Gli stessi quattro numeri stanno in DisegnoScheda nel Control Center.
  const MEMPIANTA = {
    w: 304.66, h: 139.98,
    vx0: 125.0, vx1: 220.0, vy0: 4.0, vy1: 116.0,
    // x, y, larghezza, altezza, girato di 45 gradi
    mem: [[135.24, 90.33, 8.78, 11.25, 1], [159.89, 105.83, 9.75, 12.75, 0],
          [184.59, 105.83, 9.75, 12.75, 0], [209.24, 90.33, 8.78, 11.25, 1],
          [135.24, 29.33, 8.78, 11.25, 1], [159.89, 13.83, 9.75, 12.75, 0],
          [184.59, 13.83, 9.75, 12.75, 0], [209.24, 29.33, 8.78, 11.25, 1]],
    // sull'altra faccia: si disegnano tratteggiati, per orientarsi
    apu: [172.20, 59.80, 42.4, 42.4],
    fch: [60.50, 82.20, 23.1, 23.1],
    lontani: [[7.8, 56.1, 10.3, 16.5, "DP"], [12.0, 96.1, 13.5, 15.6, "LAN"],
              [12.0, 75.1, 6.7, 13.1, ""], [11.5, 37.1, 5.7, 13.1, ""],
              [31.2, 8.1, 20.7, 7.5, "M.2"], [233.8, 130.6, 12.6, 11.5, "12V"],
              [255.8, 131.0, 9.0, 11.5, ""], [275.8, 131.0, 9.0, 11.5, ""],
              [96.50, 104.20, 15.7, 15.7, ""]],
    buchi: [[7.5, 11.1, 2.5], [7.5, 111.1, 2.5],
            [298.8, 17.3, 2.9], [298.8, 27.3, 2.9]],
    // cosa c'e' davvero su questa faccia oltre alla memoria. Il blocco fitto in
    // mezzo e' il disaccoppiamento dell'APU, sul retro proprio sotto il die.
    minuteria: [[54.74, 6.18, 11.43, 4.06], [25.06, 91.31, 1.3, 2.38],
                [23.87, 85.35, 2.38, 1.3], [22.98, 80.32, 1.3, 2.38],
                [68.19, 3.94, 2.38, 1.3], [112.01, 7.02, 1.57, 0.9],
                [99.8, 47.32, 6.53, 0.9], [99.8, 57.05, 6.53, 0.9],
                [99.8, 42.37, 6.53, 0.9], [63.35, 51.92, 6.53, 0.9],
                [240.3, 108.5, 6.53, 0.9], [240.3, 97.3, 6.53, 0.9],
                [21.07, 84.08, 0.9, 1.57], [70.6, 87.63, 1.57, 0.9],
                [150.36, 56.52, 0.9, 1.35], [179.74, 69.46, 0.9, 1.35],
                [181.69, 69.46, 0.9, 1.35]]
  };

  // il disaccoppiamento: due colonne e sei file, generate invece che elencate
  for (let i = 0; i < 10; i++) MEMPIANTA.minuteria.push([161.74, 50.33 + i * 2, 1.35, 0.9]);
  for (let i = 0; i < 7; i++) MEMPIANTA.minuteria.push([180.24, 55.33 + i * 2, 1.35, 0.9]);
  for (let i = 0; i < 5; i++) MEMPIANTA.minuteria.push([182.69, 55.33 + i * 2, 1.35, 0.9]);
  for (let i = 0; i < 5; i++) MEMPIANTA.minuteria.push([185.14, 55.33 + i * 2, 1.35, 0.9]);
  for (const y of [51.83, 54.83, 57.83, 60.83, 63.83, 66.83])
    for (let i = 0; i < 8; i++) MEMPIANTA.minuteria.push([163.74 + i * 2, y, 0.9, 1.35]);

  // Blu se e' freddo, verde se e' normale, giallo se e' caldo, rosso se e'
  // troppo caldo. Quattro parole, quattro fermate, e i numeri in mezzo vengono
  // da cosa fanno davvero questi chip: a riposo stanno sui 44, sotto carico sui
  // 50, il picco misurato e' 60. Percio' il verde copre da 48 a 72 e il riposo
  // ci cade dentro, il blu vuol dire freddo davvero e il giallo comincia dove
  // una lettura smette di essere ordinaria. Il rosso e' a 90 perche' e' li' che
  // la GDDR6 e' data per buona: deve voler dire vai a guardare, o non vuol dire
  // niente.
  // ⚠️ Le stesse quattro fermate stanno in colore_temp() nella finestra. Un chip
  // verde nella finestra e giallo nel browser sono due affermazioni diverse
  // sulla stessa temperatura.
  const MEMFERMATE = [[35, "#5a8fd8"], [48, "#8fbf6a"],
                      [72, "#d8a849"], [90, "#d85a5a"]];

  function memTinta(c) {
    if (c == null) return "#3b4a3f";
    const rgb = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16),
                      parseInt(s.slice(5, 7), 16)];
    if (c <= MEMFERMATE[0][0]) return MEMFERMATE[0][1];
    for (let i = 0; i < MEMFERMATE.length - 1; i++) {
      const [c0, s0] = MEMFERMATE[i], [c1, s1] = MEMFERMATE[i + 1];
      if (c <= c1) {
        const k = (c - c0) / (c1 - c0), a = rgb(s0), b = rgb(s1);
        return "rgb(" + a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(",") + ")";
      }
    }
    return MEMFERMATE[MEMFERMATE.length - 1][1];
  }

  function memScheda(gradi) {
    const cv = $("#mem-board");
    if (!cv) return;
    const P = MEMPIANTA, dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth;
    if (!(w > 40)) return;
    const vw = P.vx1 - P.vx0, vh = P.vy1 - P.vy0;
    const h = Math.min(320, Math.round(w * vh / vw));
    if (cv.height !== Math.round(h * dpr) || cv.width !== Math.round(w * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      cv.style.height = h + "px";
    }
    const x = cv.getContext("2d");
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, w, h);

    const k = Math.min((w - 4) / vw, (h - 4) / vh);
    const x0 = (w - vw * k) / 2, y0 = (h - vh * k) / 2;
    // da millimetri a pixel, specchiando: si guarda la scheda da sotto, e lo
    // specchio e' la stessa sottrazione del ritaglio (vx1 - mx)
    const cx = mx => x0 + (P.vx1 - mx) * k;
    const cy = my => y0 + (my - P.vy0) * k;
    const px = (mx, mw) => cx(mx) - mw * k / 2;
    const py = (my, mh) => cy(my) - mh * k / 2;

    // roundRect non c'e' su tutti i browser: senza di lui si disegna squadrato,
    // che e' brutto ma leggibile, invece di non disegnare niente.
    function box(mx, my, mw, mh, r) {
      x.beginPath();
      if (x.roundRect) x.roundRect(px(mx, mw), py(my, mh), mw * k, mh * k, (r || 0.8) * k);
      else x.rect(px(mx, mw), py(my, mh), mw * k, mh * k);
    }

    x.lineWidth = 1.4; x.strokeStyle = "#3a5740"; x.fillStyle = "#17241a";
    x.fillRect(x0 - P.w * k, y0 + (0 - P.vy0) * k, P.w * 2 * k, P.h * k);

    x.fillStyle = "#1a2a1d";
    box(172, 60, 112, 112, 10); x.fill();

    // l'altra faccia, solo di contorno: sta dietro la scheda, non sopra
    x.setLineDash([3, 3]); x.strokeStyle = "#4d6e56";
    [...P.lontani.map(l => [l[0], l[1], l[2], l[3]]), P.fch]
      .forEach(([mx, my, mw, mh]) => { box(mx, my, mw, mh, 0.8); x.stroke(); });
    // L'APU e' cio' intorno a cui stanno tutti e otto - fra 47,6 e 48,0 mm dal
    // suo centro - e da riquadro vuoto era la cosa piu' pallida del disegno che
    // spiega. Riempito, ma scuro e tratteggiato: resta sull'altra faccia.
    x.fillStyle = "#0b140f"; x.strokeStyle = "#6d8f74"; x.lineWidth = 1.2;
    box(P.apu[0], P.apu[1], P.apu[2], P.apu[3], 0.8); x.fill(); x.stroke();
    x.setLineDash([]);

    x.textAlign = "center"; x.textBaseline = "middle";
    x.font = "700 " + Math.max(8, 4.0 * k).toFixed(1) + "px 'DejaVu Sans Mono',monospace";
    x.fillStyle = "#6d8f74";
    x.fillText("APU", cx(P.apu[0]), cy(P.apu[1]));
    x.font = Math.max(7, 3.2 * k).toFixed(1) + "px 'DejaVu Sans Mono',monospace";
    x.fillStyle = "#4d6e56";
    P.lontani.forEach(([mx, my, , , et]) => { if (et) x.fillText(et, cx(mx), cy(my)); });

    x.fillStyle = "#25352a";
    P.minuteria.forEach(([mx, my, mw, mh]) =>
      x.fillRect(px(mx, mw), py(my, mh), mw * k, mh * k));

    // la memoria: il pieno dice quanto scalda, il bordo dice quale chip e'
    x.font = "700 " + Math.max(8, 3.8 * k).toFixed(1) + "px 'DejaVu Sans Mono',monospace";
    // il punto caldo e' il numero che la scheda grida in alto: qui si dice QUALE
    const caldo = gradi && gradi.length ? Math.max(...gradi.filter(v => v != null)) : null;
    P.mem.forEach(([mx, my, mw, mh, girato], i) => {
      const c = (gradi && gradi.length > i) ? gradi[i] : null;
      x.save();
      x.translate(cx(mx), cy(my));
      if (girato) x.rotate(Math.PI / 4);
      x.beginPath();
      if (x.roundRect) x.roundRect(-mw * k / 2, -mh * k / 2, mw * k, mh * k, 0.7 * k);
      else x.rect(-mw * k / 2, -mh * k / 2, mw * k, mh * k);
      x.fillStyle = memTinta(c);
      x.globalAlpha = c == null ? 0.18 : 0.78;
      x.fill();
      x.globalAlpha = 1;
      x.lineWidth = 1.6; x.strokeStyle = MEMCOL[i]; x.stroke();
      if (c != null && c === caldo) {
        x.globalAlpha = 0.28; x.lineWidth = 5;
        x.beginPath();
        if (x.roundRect) x.roundRect(-mw * k / 2 - 3, -mh * k / 2 - 3, mw * k + 6, mh * k + 6, 0.9 * k);
        else x.rect(-mw * k / 2 - 3, -mh * k / 2 - 3, mw * k + 6, mh * k + 6);
        x.stroke();
        x.globalAlpha = 1;
      }
      x.restore();
      // il numero resta dritto anche dove il chip e' girato
      x.fillStyle = c == null ? "#6b5a34" : "#f0e6d2";
      x.fillText(String(i), cx(mx), cy(my));
    });
  }

  let memGraf = null, memTess = [], memAttiva = false, memInCorso = false;

  function memCostruisci() {
    const serie = MEMCOL.map((c, i) => ({ l: "chip " + i, c: c, k: "chip" + i }));
    memGraf = new Mini($("#mem-cv"), serie);
    const box = $("#mem-tess");
    box.innerHTML = "";
    memTess = serie.map((s, i) => {
      const b = document.createElement("button");
      b.style.color = s.c;
      b.textContent = s.l + "  –";
      b.onclick = () => {
        memGraf.visibili[i] = !memGraf.visibili[i];
        b.classList.toggle("off", !memGraf.visibili[i]);
        memGraf.draw();
      };
      box.appendChild(b);
      return b;
    });
    $("#mem-btn").onclick = () => {
      if (memInCorso) return;
      memInCorso = true;
      fetch("/api/gddr6", { method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ azione: memAttiva ? "ferma" : "avvia" }) })
        .then(r => r.json())
        .then(r => { if (!r.ok) $("#mem-nota").textContent = r.errore || T("x_fail", "failed"); })
        .catch(() => {})
        .then(() => { memInCorso = false; memGiro(); });
    };
  }

  function mmss(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function memGiro() {
    fetch("/api/gddr6").then(r => r.ok ? r.json() : null).then(d => {
      if (!d) return;
      $("#mem").style.display = "";
      memAttiva = !!d.attiva;
      const motivo = d.perche_no;
      const btn = $("#mem-btn");
      btn.textContent = memAttiva ? T("mem_stop", "Stop reading") : T("mem_go", "Read the memory");
      btn.disabled = !!motivo;
      if (motivo) $("#mem-nota").textContent = motivo;
      else if (memAttiva && d.da != null)
        $("#mem-nota").textContent = T("mem_since", "reading for %s").replace("%s", mmss(d.da));
      else
        $("#mem-nota").textContent = T("mem_idle", "the reading is started when needed");

      const g = d.gradi || [];
      memScheda(memAttiva && g.length === 8 ? g : null);
      if (memAttiva && g.length === 8) {
        memGraf.push(g);
        $("#mem-riass").textContent =
          T("mem_avg", "average %s °C").replace("%s", d.media) + "\n" +
          T("mem_hot", "hotspot %s °C (chip %s)").replace("%s", d.caldo).replace("%s", d.caldo_chip);
      } else if (!memAttiva) {
        $("#mem-riass").textContent = "";
      }
      memTess.forEach((b, i) => {
        const dd = memGraf.data[i];
        const v = (memAttiva && dd.length) ? Math.round(dd[dd.length - 1]) + " C" : "-";
        b.textContent = "chip " + i + "  " + v;
      });
    }).catch(() => {});
  }

  function sicCarica() {
    fetch("/api/sicurezza").then(r => r.ok ? r.json() : null).then(d => {
      const st = d && d.stato;
      if (!st) return;                       // nessun processore sicuro: niente riquadro
      $("#sic").style.display = "";
      $("#sic-tit").textContent = T("sic_tit", "Platform security state");
      $("#sic-bl").textContent = st.bootloader ? "bootloader " + st.bootloader : "";
      $("#sic-righe").innerHTML = SICRIGHE.filter(r => r[0] in st).map(r => {
        const on = !!st[r[0]];
        return `<span class="dot ${on ? "on" : "no"}">&#9679;</span>` +
               `<span class="nome">${T("sic_" + r[0], r[1])}</span>` +
               `<span class="senso">${T("sicv_" + r[0] + (on ? "_1" : "_0"), on ? r[2] : r[3])}</span>`;
      }).join("");
    }).catch(() => {});
  }

  fetch("/api/status").then(r => r.json())
    .then(s => { $("#host").textContent = (s && s.host) || ""; })
    .catch(() => {});
  window.addEventListener("resize", () => grafici.forEach(g => g.m.draw()));
})();
</script>
</body></html>
