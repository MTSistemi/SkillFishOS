---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - networkcfg
    - hwclock
    - services-systemd
    - packages
    - grubcfg
    - bootloader
    # Dopo bootloader: riesegue grub-install (anche --removable) e ripara gli
    # extent del kernel scritto da unpackfs. Senza questo passaggio si finisce
    # in `grub rescue>` al primo avvio, su ext4 come su btrfs (issue #12 e #20).
    # Proposto da Cyryl Sochacki nella PR #26.
    - shellprocess@boot_reconfigure
    - shellprocess@post-install
    - umount
  - show:
    - finished

branding: skillfish
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
