---
# "local" e' gia' /usr/lib/<architettura>/calamares/modules: elencare anche il
# percorso esteso faceva scandire due volte la stessa cartella. Sulla BC-250,
# dove l'installazione funziona, c'e' solo "local".
modules-search: [ local ]

# LE DUE ISTANZE DI shellprocess VANNO DICHIARATE
# shellprocess compare due volte nella sequenza con due configurazioni diverse.
# Senza questo blocco Calamares deve arrangiarsi a inventare l'istanza al volo, e
# nel binario di calamares 3.4.2 di sid ci sono sia
# "Invalid module instance in *instances* or *sequence*" sia
# "is not listed in the *instances*" ... "using a bogus instance instead".
# Dichiarandole si sa con certezza quale file di configurazione legge ciascuna.
instances:
  - id: boot_reconfigure
    module: shellprocess
    config: shellprocess@boot_reconfigure.conf
  - id: post-install
    module: shellprocess
    config: shellprocess@post-install.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - networkcfg
    - hwclock
    - services-systemd
    - packages
    - grubcfg
    - bootloader
    # Dopo bootloader: riesegue grub-install (anche --removable) e ripara gli
    # extent del kernel scritto da unpackfs. Senza questo passaggio si finisce
    # in `grub rescue>` al primo avvio, su ext4 come su btrfs (issue #12 e #20).
    # Proposto da Cyryl Sochacki nella PR #26.
    - shellprocess@boot_reconfigure
    - shellprocess@post-install
    - umount
  - show:
    - finished

branding: skillfish
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
