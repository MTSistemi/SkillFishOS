# shellprocess@post-install.conf - prepara snapper sul sistema appena installato
#
# PERCHE' E' STATO RISCRITTO DA CAPO
# Prima lo script era scritto cosi':
#
#     script:
#       - "-": |
#           #!/bin/bash
#           ...
#
# che in YAML non e' ne' una stringa ne' una mappa con la chiave `command`: e'
# una mappa con la chiave "-". La CommandList di Calamares accetta solo quelle
# due forme e su tutto il resto scrive "Bad CommandList element" e tira dritto.
# Il blocco veniva quindi scartato in silenzio: snapper non e' mai stato
# configurato su nessun sistema installato da questa ISO, e non se ne accorgeva
# nessuno perche' l'installazione finiva senza errori.
#
# COME VANNO SCRITTI I COMANDI
# Una lista di stringhe, come in shellprocess@boot_reconfigure.conf. Ogni voce
# viene passata a /bin/sh -c dentro il chroot del bersaglio, quindi ||, && e le
# ridirezioni funzionano; il $ invece NO: Calamares se lo prende come propria
# variabile e l'installazione muore con "variabili mancanti". Per lo stesso
# motivo niente sintassi solo-bash (&>): qui la shell e' dash.
---
message: Configuring system snapshots...
dontChroot: false
timeout: 300
script:
    # --no-dbus e' obbligatorio: dentro il chroot non gira snapperd, e senza
    # questa opzione snapper si ferma sull'errore di D-Bus.
    # --template legge /etc/snapper/config-templates/skillfish-root, che l'hook
    # 0090-snapper-grub-btrfs mette nel squashfs (libsnapper cerca i modelli sia
    # li' sia in /usr/share/snapper/config-templates, verificato con strings).
    # Se il modello non ci fosse si ripiega su quello predefinito, e se il
    # filesystem non e' btrfs non si fa niente: su ext4 snapper non funziona e
    # l'installazione deve concludersi lo stesso.
    - >-
      test -f /etc/snapper/configs/root ||
      snapper --no-dbus --config root create-config --template skillfish-root / ||
      snapper --no-dbus --config root create-config / || true
    # L'istantanea dello stato appena installato, cioe' il punto a cui tornare
    # se un aggiornamento va storto. Nessun algoritmo di pulizia apposta: cosi'
    # non la cancella la manutenzione automatica di snapper.
    # Descrizione in inglese, come tutto cio' che non e' tradotto.
    - >-
      test -f /etc/snapper/configs/root &&
      snapper --no-dbus --config root create
      --description "SkillFishOS installation" || true
