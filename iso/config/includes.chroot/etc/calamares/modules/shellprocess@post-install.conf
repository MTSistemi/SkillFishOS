# shellprocess@post-install.conf - finishes the freshly installed system
#
# WHY IT WAS REWRITTEN FROM SCRATCH
# The script used to be written like this:
#
#     script:
#       - "-": |
#           #!/bin/bash
#           ...
#
# which in YAML is neither a string nor a map with the `command` key: it is a
# map with the key "-". Calamares' CommandList accepts only those two forms and
# for anything else writes "Bad CommandList element" and carries on. The block
# was dropped in silence: snapper was never set up on any system installed from
# this ISO, and nobody noticed because the installation ended without errors.
#
# HOW THE COMMANDS ARE WRITTEN
# A list of strings, as in shellprocess@boot_reconfigure.conf. Each entry is
# passed to /bin/sh -c inside the target's chroot, so ||, && and redirections
# work; $ does NOT: Calamares takes it as one of its own variables and the
# installation dies with "missing variables". For the same reason no bash-only
# syntax (&>): the shell here is dash.
---
message: Configuring system snapshots...
dontChroot: false
timeout: 300
script:
    # live-build's "no Recommends" (the ISO is built with --apt-recommends
    # false) must not reach the installed system: there it made every later
    # apt install skip the Recommends, which is how alsa-ucm-conf, and with it
    # the sound of SOF mini PCs, went missing on 26.06.5 (SYSFORM review,
    # 27/10/2026). Removed before the installation snapshot below, so the point
    # to go back to is already clean.
    - rm -f /etc/apt/apt.conf.d/00recommends
    # --no-dbus is required: snapperd does not run inside the chroot, and
    # without this option snapper stops on the D-Bus error.
    # --template reads /etc/snapper/config-templates/skillfish-root, which hook
    # 0090-snapper-grub-btrfs puts into the squashfs (libsnapper looks for
    # templates both there and in /usr/share/snapper/config-templates, checked
    # with strings). Without the template it falls back to the default one, and
    # if the filesystem is not btrfs nothing is done: snapper does not work on
    # ext4 and the installation must finish anyway.
    - >-
      test -f /etc/snapper/configs/root ||
      snapper --no-dbus --config root create-config --template skillfish-root / ||
      snapper --no-dbus --config root create-config / || true
    # The snapshot of the state just installed, i.e. the point to go back to if
    # an update goes wrong. Deliberately no cleanup algorithm, so snapper's
    # automatic maintenance does not delete it.
    # Description in English, like everything that is not translated.
    - >-
      test -f /etc/snapper/configs/root &&
      snapper --no-dbus --config root create
      --description "SkillFishOS installation" || true
