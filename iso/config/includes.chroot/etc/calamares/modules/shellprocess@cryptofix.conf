# Sistema un'installazione cifrata: toglie il keyscript che manda in busybox e
# genera la mappa di tastiera per il prompt di GRUB (issue #61).
#
# ⚠️ Gira sempre, anche su installazioni non cifrate: in quel caso lo script
# non trova niente da correggere e non tocca nulla. Meglio cosi' che una
# condizione in piu' che un giorno smette di essere vera senza che nessuno se
# ne accorga.
---
dontChroot: false
timeout: 900
script:
  - /usr/local/bin/skillfish-crypto-fix pre
