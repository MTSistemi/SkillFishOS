# mount.conf - monta il disco di destinazione e crea i sottovolumi btrfs
#
# MANCAVA, e con lui mancava meta' della configurazione dei filesystem: in
# calamares 3.4.2 (quello di sid, l'unico che ci interessa) e' QUESTO il modulo
# che decide con quali opzioni si monta e quali sottovolumi esistono. Il modulo
# fstab non legge piu' niente di suo: si limita a rileggere da globalstorage cio'
# che mount ci ha scritto.
#   mount/main.py  riga 286: globalstorage.insert("btrfsSubvolumes", ...)
#   mount/main.py  riga 392: globalstorage.insert("mountOptionsList", ...)
#   fstab/main.py  riga 207: globalstorage.value("btrfsSubvolumes")
#   fstab/main.py  riga 408: globalstorage.value("mountOptionsList")
# Ecco perche' il blocco btrfsSubvolumes che stava in fstab.conf non lo leggeva
# nessuno: era nel file sbagliato.
---
# I montaggi di servizio dentro il chroot del sistema installato. Sono gli stessi
# che genera eggs sulla BC-250: efivarfs serve a grub-install/efibootmgr per
# scrivere la voce di avvio in NVRAM, /run/udev serve a grub-probe per risalire
# dal punto di montaggio al dispositivo.
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# I NOMI DEI SOTTOVOLUMI
# Sono quelli della BC-250 e quelli che scripts/fix-eggs-calamares-boot.py
# pretende di ritrovare (WANT_SUBVOLS), barra iniziale compresa: il modulo li usa
# come percorsi relativi alla radice del volume, quindi "/@" e non "@".
#
# Niente @snapshots: quel sottovolume lo crea snapper da solo con create-config,
# che lanciamo in shellprocess@post-install. Dichiararlo qui significherebbe
# crearlo due volte e far fallire snapper.
#
# Niente @boot: /boot resta dentro @, cosi' GRUB non deve attraversare un secondo
# sottovolume per arrivare alla propria configurazione - era la causa del
# "@boot subvolume not found" della issue #12.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /games
    subvolume: /@games

# Il sottovolume dello swap su file. Il modulo lo aggiunge da solo (montato su
# /swap) quando nella pagina del partizionamento si sceglie lo swap su file, che
# e' il predefinito impostato in partition.conf.
btrfsSwapSubvol: /@swap

# LE OPZIONI DI MONTAGGIO - QUI, NON IN fstab.conf
# NIENTE subvol= in questa lista: e' il modulo ad anteporre subvol=<sottovolume>
# a queste opzioni, sia quando monta (mount/main.py riga ~310) sia quando fstab
# scrive la riga (fstab/main.py riga ~280). Il vecchio fstab.conf aveva
# subvol=@ dentro mountOptions: sarebbe finito duplicato nella riga di fstab e
# per giunta puntava a un sottovolume che nessuno crea, visto che i nostri si
# chiamano /@ e non @.
#
# btrfs_swap e' una voce a parte apposta: il file di swap su btrfs non tollera la
# compressione, quindi il sottovolume /@swap si monta senza compress=zstd.
# Mettendoci zstd, swapon rifiuterebbe il file.
mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1 ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
