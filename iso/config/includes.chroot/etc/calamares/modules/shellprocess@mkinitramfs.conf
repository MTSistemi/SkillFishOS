# Rigenera l'immagine di avvio del sistema appena installato.
#
# ⚠️ Serve soprattutto a chi ha cifrato il disco: e' qui che l'initramfs impara
# ad aprire la radice. Senza questo passaggio l'installazione riesce e poi al
# primo avvio ci si ritrova al prompt di busybox (issue #61).
#
# ⚠️ `update-initramfs -u -k all` e non `mkinitramfs -o ...$(uname -r)`: il
# secondo scrive il nome del kernel LIVE, e funziona solo finche' il kernel
# installato e' lo stesso di quello che sta girando. E' vero oggi per caso, non
# per costruzione.
---
message: Creo l'immagine di avvio (initramfs)...
dontChroot: false
timeout: 600
script:
  - update-initramfs -u -k all
