# machineid.conf - identificativo univoco della macchina installata
#
# MANCAVA. Serve perche' nel squashfs il machine-id e' vuoto apposta (lo azzera
# l'hook 8020-remove-dbus-machine-id di live-build): se nessuno lo rigenera, il
# sistema installato parte senza identificativo e systemd/D-Bus se ne lamentano
# a ogni avvio. Peggio ancora sarebbe il contrario, cioe' spedirlo dentro
# l'immagine: tutte le installazioni avrebbero lo stesso.
---
systemd: true
dbus: true

# ATTENZIONE AL NOME DELLA CHIAVE: e' dbus-symlink, non symlink. Quella generata
# da eggs sulla BC-250 si chiama "symlink" e il modulo la ignora in silenzio -
# le uniche chiavi presenti in libcalamares_job_machineid.so sono systemd, dbus,
# dbus-symlink, entropy-copy, entropy-files. Con la chiave giusta
# /var/lib/dbus/machine-id diventa un collegamento a /etc/machine-id invece di
# restare un secondo file che col tempo puo' divergere.
dbus-symlink: true

# Copia il seme dell'entropia dalla sessione live al sistema installato, cosi'
# il primo avvio non parte con il generatore casuale a secco. Il seme della
# live e' stato rigenerato all'avvio da systemd-random-seed, quindi non e'
# quello identico per tutti che sta nel squashfs.
entropy-copy: true
entropy-files:
  - /var/lib/urandom/random-seed
  - /var/lib/systemd/random-seed
