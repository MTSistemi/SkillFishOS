# bootloader.conf - installazione di GRUB sul sistema appena copiato
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# ATTENZIONE ALLA MAIUSCOLA: la chiave e' efiBootloaderId, con la elle minuscola.
# Qui c'era scritto efiBootLoaderId e il modulo non la vedeva - la cerca cosi'
# com'e' (bootloader/main.py riga 433, `if "efiBootloaderId" in ...`). Non se ne
# accorgeva nessuno perche' il ripiego e' bootloaderEntryName del branding, che
# vale gia' SkillFishOS: stesso risultato per combinazione, non perche' il file
# funzionasse.
efiBootloaderId: "SkillFishOS"

# Il firmware della BC-250 non tiene in modo affidabile le voci di avvio in NVRAM,
# quindi si scrive anche il caricatore removibile \EFI\BOOT\BOOTX64.EFI: e' quello
# che molte di queste schede avviano davvero, e su un firmware normale non da'
# fastidio a nessuno. La copia fatta qui e' comunque incompleta (manca lo stub di
# configurazione accanto al binario): a rimediare e' il secondo grub-install
# --removable di shellprocess@boot_reconfigure, vedi issue #20.
installEFIFallback: true

# Niente GRUB per BIOS su una macchina EFI: la ISO si avvia in tutti e due i modi
# (--bootloaders "grub-efi,syslinux" in auto/config), ma il sistema installato
# usa il modo con cui e' stata avviata l'installazione.
installHybridGRUB: false

# TOLTE TRE CHIAVI CHE NON LEGGEVA NESSUNO
# kernelLine e kernelLineSufix valgono solo per le voci di systemd-boot, che qui
# non usiamo (efiBootLoader: grub); "timeout" non compare ne' nel modulo ne' nel
# suo schema (bootloader.schema.yaml, additionalProperties: false). I parametri
# del kernel e l'attesa del menu li decide GRUB, cioe' grubcfg.conf e i frammenti
# in /etc/default/grub.d: tenerne una seconda copia qui voleva dire avere due
# posti che dicono cose diverse sulla stessa riga di comando.
