---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
# The BC-250 UEFI is unreliable at persisting NVRAM boot entries, so also write
# the removable fallback bootloader (\EFI\BOOT\BOOTX64.EFI) — this is what many
# of these boards actually boot, and it never hurts on standard firmware.
efiBootLoaderId: "SkillFishOS"
installEFIFallback: true

kernelLine: ""
kernelLineSufix: "quiet splash mitigations=off"

timeout: 5
