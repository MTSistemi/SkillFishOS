# users.conf - creazione dell'utente e della password di root
#
# MANCAVA. Senza questo file la pagina "utenti" resta senza gruppi predefiniti:
# l'utente appena creato nascerebbe senza sudo, senza audio, senza video, cioe'
# senza poter amministrare la macchina ne' usare il sonoro.
---
# Il gruppo primario dell'utente.
userGroup: users

# I GRUPPI SECONDARI SONO QUELLI DELL'UTENTE VERO DELLA BC-250
# Presi da `id skillfish` sulla macchina di sviluppo, che e' il sistema che
# cloniamo: cdrom floppy sudo audio dip video plugdev netdev users, piu' tre che
# il modello di eggs non prevede e che su questo prodotto servono davvero:
#   lpadmin - amministrare le stampanti (nell'immagine c'e' CUPS, lista 40-printing)
#   input   - leggere i dispositivi di /dev/input, cioe' i gamepad; e' una
#             console da gioco, e senza questo gruppo l'utente non li vede
#   render  - accedere ai nodi /dev/dri/render*, quindi calcolo GPU e codifica
#             video accelerata
# Sono scritti in forma estesa con must_exist: false perche' cosi' Calamares li
# crea se nell'immagine non esistessero (lpadmin c'e' solo se CUPS e' installato)
# invece di far fallire l'installazione.
defaultGroups:
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - users
  - name: lpadmin
    must_exist: false
  - name: input
    must_exist: false
  - name: render
    must_exist: false

# Gruppo usato dai gestori di accesso per l'ingresso automatico. Non esiste in
# Debian: se l'utente spunta l'accesso automatico, Calamares lo crea.
autologinGroup: autologin

# In Debian si amministra con sudo, e il gruppo si chiama sudo (non wheel).
sudoersGroup: sudo

# Si puo' impostare anche la password di root, ma non e' la stessa dell'utente:
# ognuna ha il suo campo. Sono i due valori della BC-250.
setRootPassword: true
doReusePassword: false
