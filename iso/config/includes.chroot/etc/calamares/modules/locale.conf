# locale.conf - fuso orario e lingua
#
# MANCAVA. Senza il file la mappa dei fusi parte da un punto qualunque e chi
# installa deve cercarsi la propria citta' a mano.
---
# Punto di partenza della mappa. E' quello della BC-250, ma conta poco: se
# geoip risponde, la scelta viene sovrascritta con il fuso di chi sta
# installando, e in ogni caso la pagina resta modificabile.
region: Europe
zone: Rome

# Il servizio e' quello di KDE, senza chiave e senza registrazione. Se non c'e'
# rete non succede niente: si resta sul valore qui sopra.
geoip:
  style: json
  url: https://geoip.kde.org/v1/calamares
  selector: ""
