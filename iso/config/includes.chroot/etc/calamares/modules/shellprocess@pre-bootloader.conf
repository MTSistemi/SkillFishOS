# shellprocess@pre-bootloader.conf - cosa va fatto PRIMA di grub-mkconfig
#
# PERCHE' ESISTE
# Il modulo `bootloader` di Calamares esegue grub-mkconfig, che a sua volta
# esegue /etc/grub.d/41_snapshots-btrfs. Se sul disco di destinazione ci sono
# gia' degli snapshot - cioe' quando si REINSTALLA sopra un SkillFishOS - quel
# gancio prova a montarli per UUID. Dentro il chroot dell'installatore
# /dev/disk/by-uuid non e' popolato, il mount fallisce, e il suo codice 32
# risale fino a far fallire l'intera installazione:
#
#   Detecting snapshots ...
#   mount: /tmp/grub-btrfs.XXXX: special device /dev/disk/by-uuid/<uuid>
#          does not exist.
#
# Segnalato da Cyryl Sochacki con il registro alla mano e riprodotto il
# 19/08/2026. Su un disco cancellato non si vede, perche' snapshot non ce ne
# sono e il gancio non ha niente da montare: e' per questo che ci era sfuggito.
#
# Il rilevatore lo riaccende shellprocess@boot_reconfigure, che gira dopo il
# bootloader e chiama update-grub: il menu degli snapshot si riprende subito.
---
message: Preparing the boot menu...
dontChroot: false
timeout: 60
script:
    - /usr/local/bin/skillfish-grub-btrfs spegni || true
