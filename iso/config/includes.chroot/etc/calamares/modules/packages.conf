# packages.conf - gestore dei pacchetti del sistema installato
#
# MANCAVA, ED ERA UN GUASTO VERO, non una svista cosmetica: il modulo packages
# e' nella sequenza, e la prima cosa che fa e' leggere `backend`. Se non lo
# trova esce con ("Bad backend", 'backend="None"') - packages/main.py riga 753 -
# e in Calamares un modulo che torna un errore ferma l'installazione. Cioe':
# senza questo file l'installazione sarebbe morta a pochi passi dalla fine,
# dopo aver gia' scritto il bootloader.
---
backend: apt

# Non c'e' niente da installare o da togliere: il sistema arriva completo dal
# squashfs. Il modulo resta nella sequenza perche' e' il punto in cui, volendo,
# si aggiungerebbero le `operations` (per esempio togliere live-boot dal sistema
# installato), ma finche' non serve deve essere un passaggio a vuoto.
#
# update_db e update_system restano spenti apposta: sono operazioni di rete, e
# l'installazione deve funzionare identica anche senza collegamento.
update_db: false
update_system: false
