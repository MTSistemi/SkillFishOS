# finished.conf - ultima schermata
#
# MANCAVA. Senza il file l'ultima pagina non offre il riavvio e chi ha appena
# installato resta nella sessione live senza capire se puo' spegnere.
---
# user-checked = compare la casella "riavvia adesso", gia' spuntata, ma resta
# l'utente a decidere. La BC-250 usa ancora la coppia restartNowEnabled +
# restartNowChecked, che il modulo di calamares 3.4.2 accetta ma segnala come
# deprecata ("Configuring the finished module with deprecated restartNowEnabled
# settings", stringa dentro libcalamares_viewmodule_finished.so): qui usiamo
# direttamente la chiave nuova, che vale la stessa cosa.
restartNowMode: user-checked
restartNowCommand: reboot

# Niente notifica di sistema a fine installazione: la schermata e' gia' in primo
# piano e sulla live la notifica arriverebbe a chi sta gia' guardando.
notifyOnFinished: false
