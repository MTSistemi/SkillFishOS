# partition.conf - pagina del partizionamento
---
# LA PARTIZIONE EFI IN FORMA NUOVA
# Prima c'erano le tre chiavi sciolte efiSystemPartition / efiSystemPartitionSize
# / efiSystemPartitionName. In calamares 3.4 la forma corrente e' questa mappa,
# ed e' quella che eggs genera sulla BC-250, cioe' l'unica provata sul campo
# (installazione della 26.06.3 in macchina virtuale).
#
# recommendedSize e' quanto viene creato quando si azzera il disco: 512 MiB e non
# i 300 del modello di eggs, perche' su questo sistema nella ESP finiscono sia la
# voce con il nome della distribuzione sia il ripiego removibile
# \EFI\BOOT\BOOTX64.EFI (installEFIFallback in bootloader.conf), e stare larghi
# costa mezzo giga di disco.
# minimumSize resta basso apposta: e' la soglia per RIUSARE una ESP che c'e'
# gia', e quelle di Windows spesso stanno sotto i 300 MiB. Alzarla vorrebbe dire
# rifiutare dischi perfettamente validi.
efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 32MiB
  label: EFI

# SOLO btrfs ED ext4
# Erano proposti anche xfs e f2fs. Non e' una scelta gratuita toglierli: meta'
# di quello che rende questo sistema quello che e' - istantanee, ritorno
# indietro, voci di GRUB per gli snapshot, snapper, SkillFishOS Snapshot - esiste solo
# su btrfs, e gli strumenti di riparazione dell'avvio che spediamo
# (skillfish-fix-boot-extents) sono stati provati su btrfs ed ext4. Offrire un
# filesystem su cui non abbiamo mai installato significa promettere un sistema
# che poi non funziona come descritto.
defaultFileSystemType: btrfs
availableFileSystemTypes:
  - btrfs
  - ext4

# LO SWAP SU FILE
# Mancava proprio fra le scelte possibili, e il predefinito era "nessuno". Il
# prodotto usa lo swap su FILE: su btrfs si ridimensiona senza ripartizionare e
# non sporca la tabella delle partizioni. E' anche quello che pretende
# scripts/fix-eggs-calamares-boot.py (initialSwapChoice: file) e il motivo per
# cui mount.conf definisce btrfsSwapSubvol: quel sottovolume viene creato solo
# se qui si sceglie "file".
userSwapChoices:
  - none
  - small
  - suspend
  - file
initialSwapChoice: file

# La voce preselezionata e' "cancella il disco", ma resta una preselezione: si
# passa comunque dal riepilogo e dalla richiesta di conferma (prompt-install in
# settings.conf) prima che venga scritto qualcosa.
initialPartitioningChoice: erase

# LUKS versione 1, non 2. GRUB sa aprire i volumi luks1 senza contorsioni; con
# luks2 e la derivazione argon2 la lettura di /boot da parte di GRUB diventa un
# terno al lotto. E' anche il valore della BC-250.
luksGeneration: luks1

# Tolte ensureSuspendToDisk e neverCreateSwap: il modulo di calamares 3.4.2 le
# dichiara deprecate a voce alta ("Partition-module setting *ensureSuspendToDisk*
# is deprecated", stringa dentro il modulo) e il loro compito lo fanno ormai
# userSwapChoices e initialSwapChoice qui sopra.
