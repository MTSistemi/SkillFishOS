---
# Riesegue grub-install/update-grub DOPO il modulo `bootloader`, e ripara i
# kernel scritti male da unpackfs. Vedi CHANGELOG.md #12 e #20:
#
# #20 (ext4 E btrfs) - con installEFIFallback Calamares copia shim+grubx64
# nel percorso EFI removibile ma non lo stub grub.cfg che sta accanto: il
# GRUB avviato da li' non risolve nessuna configurazione e cade in
# `grub rescue>`. Rieseguendo grub-install una seconda volta con --removable
# si scrive un BOOTX64.EFI autonomo (prefix corretto e stub al posto giusto).
#
# #12 (solo btrfs) - il kernel/initrd scritti da unpackfs hanno una mappa
# degli extent che non copre la dimensione dichiarata (manca il flag `eof`
# sull'ultimo extent): GRUB si ferma con "premature end of file" anche se
# Linux legge lo stesso file senza problemi. skillfish-fix-boot-extents
# riscrive i file con cp --reflink=never per rigenerare una mappa corretta.
#
# Il ciclo di riscrittura resta in uno SCRIPT (skillfish-fix-boot-extents),
# non qui: il modulo shellprocess espande i $... come proprie variabili e
# l'installazione muore con "variabili mancanti: f,f,f,f,f" se ci si mette
# un ciclo di shell direttamente nello YAML.
#
# ⚠️ PERCHE' dpkg-reconfigure ADESSO FINISCE CON `|| true` (15/08/2026)
# Era l'unica riga senza rete di sicurezza, e ha fatto fallire un'intera
# installazione in macchina virtuale. Il colpevole era un modulo DKMS di
# terze parti (nct6687d) che non compilava: dkms restituisce 1, il postinst
# del kernel restituisce 1, dpkg-reconfigure restituisce 1, e Calamares
# butta via tutto. Peggio ancora: la caduta avveniva PRIMA di
# skillfish-fix-boot-extents, di grub-install e della pulizia
# dell'autologin, cioe' proprio le cose senza le quali il sistema non parte.
#
# Un sensore di temperatura che non compila non e' un buon motivo per non
# installare un sistema operativo. Quello che serve davvero e' che l'initrd
# esista: quello lo si pretende, con la riga dopo, e SE MANCA si fallisce
# sul serio.
message: Final reconfiguration of the kernel and bootloader...
dontChroot: false
timeout: 900
script:
    - chmod 644 /boot/vmlinuz-`uname -r`
    - chown 0:0 /boot/vmlinuz-`uname -r`
    - INITRD=No dpkg-reconfigure -fnoninteractive linux-image-`uname -r` || true
    - test -s /boot/initrd.img-`uname -r` || update-initramfs -c -k `uname -r`
    - /usr/local/bin/skillfish-fix-boot-extents
    - >-
      grub-install --target=x86_64-efi --efi-directory=/boot/efi
      --bootloader-id=skillfishos --recheck || true
    - >-
      grub-install --target=x86_64-efi --efi-directory=/boot/efi
      --removable --recheck || true
    # Riaccende il rilevatore di snapshot sospeso prima del bootloader;
    # update-grub qui sotto rigenera il menu con gli snapshot dentro.
    - /usr/local/bin/skillfish-grub-btrfs riaccendi || true
    - update-grub || true
    # /games e' un sottovolume a se': qui gli si toglie il copy-on-write
    # mentre e' ancora VUOTO (dopo il flag non convertirebbe niente) e lo si
    # intesta all'utente appena creato.
    - /usr/local/bin/skillfish-games-subvolume prepara || true
    # ⚠️ Qui va bene, nel ramo eggs NO. Nella sequenza di eggs c'e' il modulo
    # removeuser, che cancella l'utente della live DOPO questo blocco: lo
    # script lo trovava ancora in /etc/passwd e lasciava stare l'accesso
    # automatico, che restava nel sistema installato intestato a un utente
    # inesistente. Li' la riga e' stata spostata in un passo suo, agganciato
    # dopo removeuser (shellprocess@pulizia_live).
    # Nella live-build il problema non c'e': l'utente della live lo crea
    # live-config all'avvio, nel solo strato temporaneo, e nello squashfs -
    # cioe' in quello che finisce sul disco - non esiste. Lo script quindi
    # vede giustamente un utente che non c'e' e toglie il file.
    - /usr/local/bin/skillfish-clean-live-autologin || true
