# grubcfg.conf - /etc/default/grub del sistema installato
#
# MANCAVA, e la mancanza si vedeva sulla riga di comando del kernel: senza
# configurazione il modulo usa il proprio valore predefinito, kernel_params:
# ["quiet"] (grubcfg/main.py riga 216), e riscrive GRUB_CMDLINE_LINUX_DEFAULT
# con quello. Le nostre opzioni sopravvivevano solo perche' stanno anche in
# /etc/default/grub.d/99-skillfish-bc250.cfg, che grub-mkconfig legge dopo: due
# file che dicevano cose diverse, e il primo che si guarda e' quello sbagliato.
---
# Gli stessi parametri di /etc/default/grub.d/99-skillfish-bc250.cfg, cosi' i
# due file concordano. mitigations=off e' una scelta di prestazioni presa per
# questa scheda; splash serve a plymouth.
kernel_params:
  - quiet
  - splash
  - mitigations=off

# false = GRUB_DISTRIBUTOR lo decide Calamares, prendendolo da
# bootloaderEntryName del branding (grubcfg/main.py, run(): distributor =
# branding["bootloaderEntryName"]), cioe' SkillFishOS. Con true resterebbe
# quello che il pacchetto grub di Debian ha lasciato nel squashfs.
keep_distributor: false

# false = il file esistente viene modificato riga per riga, non riscritto da
# capo. Fondamentale: in /etc/default/grub ci sono anche il tema di GRUB, la
# risoluzione e GRUB_EARLY_INITRD_LINUX_CUSTOM per l'SSDT ACPI della BC-250, e
# riscrivendo il file andrebbero persi.
overwrite: false

# false = si scrive in /etc/default/grub. Su grub.d ci sono gia' i nostri
# frammenti e non vogliamo che Calamares ne aggiunga un altro che li scavalca.
prefer_grub_d: false
