# welcome.conf - prima schermata e requisiti minimi
#
# MANCAVA. Il modulo dichiara requiredStorage e requiredRam obbligatori
# ("GeneralRequirements entry 'requiredStorage' is missing." e' un messaggio del
# modulo stesso): senza il file la pagina di benvenuto parte lamentandosi e non
# controlla piu' niente.
---
# I tre collegamenti compaiono solo se il branding li definisce; i nostri
# (supportUrl, knownIssuesUrl, releaseNotesUrl) sono in branding/skillfish.
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true

requirements:
  # 10 GiB e' il valore della BC-250 ed e' abbondante: la ISO sta in 2,3 GiB
  # compressi (SkillFishOS-ISO-info.txt) e il sistema scompattato ci sta
  # dentro con margine.
  requiredStorage: 10
  requiredRam: 1
  # `check` = cosa si controlla, `required` = cosa impedisce di proseguire.
  # power (alimentazione di rete) resta solo un avviso: la BC-250 e' fissa e
  # non ha batteria, quindi il controllo non deve mai bloccare nessuno.
  # Nessun controllo di rete: l'installazione non scarica niente, tutto arriva
  # dal squashfs, e pretendere il collegamento sarebbe solo un ostacolo.
  check:
    - storage
    - ram
    - power
    - root
  required:
    - storage
    - ram
    - root
