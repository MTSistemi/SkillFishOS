# unpackfs.conf - il modulo che copia davvero il sistema sul disco
#
# MANCAVA DEL TUTTO. Il pacchetto calamares di sid non installa niente sotto
# /etc/calamares (verificato: `dpkg -L calamares | grep ^/etc` non restituisce
# nulla) e calamares-settings-debian non e' in nessuna lista di live-build: se
# questo file non c'e', nessuno dice a Calamares dove sta il sistema da copiare
# e l'installazione si ferma subito dopo il partizionamento.
#
# IL PERCORSO E' L'UNICA COSA CHE CAMBIA RISPETTO ALLA BC-250
# La ISO di eggs e questa ISO di live-build usano tutte e due live-boot, che
# monta il supporto di avvio sotto /run/live/medium; live-build ci scrive il
# sistema compresso in live/filesystem.squashfs (auto/config non tocca ne'
# --chroot-filesystem ne' il nome dell'immagine, quindi valgono i predefiniti).
# Il percorso coincide con quello della BC-250, ma va tenuto d'occhio: se un
# giorno cambiasse --chroot-filesystem (per esempio in ext4), qui andrebbe
# cambiato anche sourcefs.
#
# destination vuoto significa "la radice del sistema installato": Calamares ci
# mette da solo il punto di montaggio del bersaglio.
---
unpack:
  - source: /run/live/medium/live/filesystem.squashfs
    sourcefs: squashfs
    destination: ""
