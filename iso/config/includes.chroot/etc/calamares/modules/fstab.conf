# fstab.conf - generazione di /etc/fstab e /etc/crypttab
#
# QUESTO FILE E' DIMAGRITO, E NON PER SEMPLIFICARE
# In calamares 3.4.2 il modulo fstab non legge piu' ne' mountOptions, ne'
# ssdExtraMountOptions, ne' efiMountOptions, ne' btrfsSubvolumes: le opzioni le
# riceve gia' pronte da globalstorage, dove le ha messe il modulo mount
# (mountOptionsList e btrfsSubvolumes). Lo dice il codice del pacchetto di sid
# (fstab/main.py righe 207 e 408) e lo conferma il suo schema,
# /usr/lib/x86_64-linux-gnu/calamares/modules/fstab/fstab.schema.yaml, che con
# additionalProperties: false ammette solo le due chiavi qui sotto.
#
# Tutta quella roba stava scritta qui e non aveva alcun effetto: le opzioni vere
# sono in mount.conf. Tenerne una copia morta in questo file e' esattamente il
# modo in cui i due file avevano finito per dire cose diverse (subvol=@ contro
# sottovolumi /@...), quindi la copia morta non la rimettiamo.
#
# Nota sul discard continuo: non lo impostiamo (ne' per btrfs ne' per ext4)
# perche' sul prodotto fstrim.timer e' abilitato - verificato sulla BC-250 con
# `systemctl is-enabled fstrim.timer` -> enabled - e il TRIM periodico e' la
# strada consigliata da Debian.
---
# Debian sblocca i volumi cifrati dall'initramfs passando la frase segreta sullo
# standard input: keyscript=/bin/cat e' la forma che genera eggs sulla BC-250.
# Deve essere una STRINGA: il modulo la infila cosi' com'e' nella riga di
# crypttab (`options=crypttab_options`). Prima qui c'era una lista di mappe, che
# nel crypttab del sistema installato sarebbe finita stampata come lista Python.
crypttabOptions: luks,keyscript=/bin/cat

# /tmp lo lasciamo a systemd, che sul prodotto lo monta gia' come tmpfs
# (verificato sulla BC-250: findmnt /tmp -> tmpfs). Senza questa chiave il
# modulo aggiungerebbe una PROPRIA riga tmpfs per /tmp ogni volta che la radice
# sta su un disco a stato solido, e ci ritroveremmo due configurazioni per lo
# stesso punto di montaggio, con le opzioni di Calamares al posto di quelle di
# systemd.
tmpOptions:
  default:
    tmpfs: false
