# SkillFishOS - impostazioni di avvio per la BC-250
# Performance-first: mitigations OFF (dev decision). Do NOT enable IOMMU (broken on BC-250).
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash mitigations=off"
# Optional 40-CU unlock (thermal-heavy, opt-in):
#   add amdgpu.bc250_cc_write_mode=3 to the line above
