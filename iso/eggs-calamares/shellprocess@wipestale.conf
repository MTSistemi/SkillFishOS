# Erase the stale LUKS signature an earlier encrypted install leaves on a
# partition that has just been formatted (issue #72). Without this a system
# installed over an old encrypted one stopped in the initramfs shell on its
# first boot: blkid saw crypto_LUKS first and udev never linked the new
# filesystem's UUID.
#
# Runs right after mount, outside the target (the partitions are the live
# system's block devices). The script finds the target under
# /tmp/calamares-root-* itself, touches only partitions that carry crypto_LUKS
# next to another signature, and never fails the installation.
---
dontChroot: true
timeout: 120
script:
  - command: /usr/local/bin/skillfish-wipe-stale-luks
    timeout: 120
