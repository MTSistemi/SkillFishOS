# Fase PRE: corregge /etc/crypttab PRIMA che Calamares costruisca l'immagine di
# avvio. Dopo sarebbe troppo tardi: dentro l'installatore update-initramfs si
# rifiuta di lavorare — «update-initramfs is disabled (live system is running
# without media mounted on /run/live/medium)» — quindi qualunque rigenerazione
# successiva e' un no-op silenzioso (issue #61).
---
dontChroot: false
timeout: 300
script:
  - /usr/local/bin/skillfish-crypto-fix pre
