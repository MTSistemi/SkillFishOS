name: "CodeQL — security & quality"

# Static analysis of the SkillFishOS sources (Python apps + tooling, and the
# Astro/JS-TS website) with the extended "security-and-quality" query suite.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "27 4 * * 1"   # weekly, Monday 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload CodeQL results
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Extended suite: security findings PLUS code-quality/maintainability.
          queries: security-and-quality
          # ⚠️ vendor/ holds third-party sources we redistribute unchanged
          # (bc250_smu_oc, MIT). Two reasons it stays out: we do not fix code
          # there, patches go upstream; and it carries a second module named
          # bc250_smu, the same name as the copy under system/usr/lib/skillfish.
          # CodeQL matched calls in one against the class of the other and
          # reported four "wrong number of arguments" on code that runs fine on
          # the board every day. Our own copies are still analysed.
          config: |
            paths-ignore:
              - vendor/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
