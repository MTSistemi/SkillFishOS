<!-- SkillFishOS: Mesa driconf defaults for the BC-250 (an APU with one pool of
     GDDR6 shared by CPU and GPU). Read by Mesa from /usr/share/drirc.d.
     radv_enable_unified_heap_on_apu: RADV advertises one memory heap instead of
     a small "VRAM" one plus GTT, so games that size their budgets on the
     device-local heap stop running out of memory on the 512 MB dynamic split.
     Suggested by the community (Necrosiak/bc250-tweaks); measured here with no
     frame-rate change in Cyberpunk. -->
<driconf>
  <device driver="radv">
    <application name="SkillFishOS BC-250 defaults" executable_regexp=".*">
      <option name="radv_enable_unified_heap_on_apu" value="true" />
    </application>
  </device>
</driconf>
