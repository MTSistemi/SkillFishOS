    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf7a"/><stop offset="0.5" stop-color="#d8a849"/><stop offset="1" stop-color="#8a6a2a"/>
