# SkillFishOS: compressed swap in RAM.
#
# The board has ~7.5 GB usable (16 GB shared with the GPU) and its only swap is
# on the NVMe. zstd compresses swapped-out pages roughly 3:1 in RAM, which is
# far faster than any disk and keeps a game from stuttering when memory runs
# short.
#
# ⚠️ swap-priority is higher than the disk swap on purpose: zram must be used
# FIRST and the partition only as overflow. A disk swap left at a higher
# priority makes this whole file pointless without saying so.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
