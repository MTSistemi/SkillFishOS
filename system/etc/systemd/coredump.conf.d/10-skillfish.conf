# SkillFishOS - un tetto ai core dump.
#
# PERCHE' ESISTE
# La ISO 26.06.3-rc2 pesava 10,19 GB contro i 6,66 GB della 26.06. Confrontando
# il contenuto delle due immagini e' venuto fuori che la crescita non era nei
# flatpak (+0,15 GB) ma in /var/lib/systemd: +3,10 GB. Dentro c'erano cinque
# core dump lasciati dai nostri test degli emulatori:
#
#   1,6 GB  core.Ryujinx.zst
#   826 MB  core.eden.zst
#   767 MB  core.eden.zst
#    28 MB  core.python3.zst
#   1,3 MB  core.plasmashell.zst
#
# Con la configurazione predefinita systemd tiene i dump fino al 10% del disco,
# senza limite per singolo file. Su una macchina da gioco, dove un emulatore ha
# facilmente 16 GB di spazio di indirizzamento mappato, basta un paio di crash
# per accumulare gigabyte - e poi l'immagine si costruisce dal sistema vivo,
# quindi quei gigabyte li scarica ogni utente.
#
# I limiti qui sotto tengono i dump utili (un crash di un'applicazione normale
# ci sta comodamente) e buttano quelli che non servirebbero comunque a nessuno:
# un dump da 1,6 GB di un emulatore non lo apre nessun debugger per diletto.
[Coredump]
Storage=external
Compress=yes

# Oltre 2 GB di spazio di indirizzamento non ci proviamo nemmeno.
ProcessSizeMax=2G

# Nessun singolo dump piu' grande di 256 MB su disco.
ExternalSizeMax=256M

# E in totale mezzo giga, non il 10% del disco.
MaxUse=512M
KeepFree=2G
