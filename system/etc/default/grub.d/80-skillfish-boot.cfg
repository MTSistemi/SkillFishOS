# SkillFishOS - come si presenta e come parte la macchina.
#
# ⚠️ Questo file e' uno SCRIPT, non un elenco di chiavi: grub-mkconfig lo
# esegue. Per questo si possono fare dei controlli, ed e' quello che serve qui:
# i parametri della BC-250 su un PC normale non hanno senso.
#
# ⚠️ E STA IN grub.d, NON IN /etc/default/grub. Calamares scrive in quel file
# (grubcfg.conf, overwrite: false) e un aggiornamento di grub ci mette le mani:
# un frammento a parte sopravvive a tutti e due. I file si leggono in ordine,
# quindi il numero conta: 80 arriva dopo i predefiniti di Debian e prima di un
# eventuale 99 messo da chi usa la macchina, che resta libero di scavalcarci.
#
# ⚠️ E SI AGGIUNGE, NON SI SOSTITUISCE. La prima stesura assegnava la riga di
# netto: provata sulla .32 avrebbe cancellato amdgpu.lockup_timeout,
# amdgpu.ppfeaturemask e lo sblocco delle CU che stanno li' per il laboratorio,
# e nessuno se ne sarebbe accorto fino al riavvio dopo.

GRUB_DISTRIBUTOR="SkillFishOS"
GRUB_THEME="/boot/grub/themes/skillfish/theme.txt"
# Lo sfondo e' 1920x1080. Con la risoluzione di serie GRUB lo schiaccia.
GRUB_GFXMODE="1920x1080,auto"
GRUB_GFXPAYLOAD_LINUX=keep

# aggiungi <parametro> - solo se non c'e' gia'.
# Il confronto guarda anche la forma `chiave=`, cosi' un valore diverso scelto
# da chi usa la macchina resta il suo.
skillfish_aggiungi() {
    for _p in "$@"; do
        _chiave="${_p%%=*}"
        case " $GRUB_CMDLINE_LINUX_DEFAULT " in
            *" $_p "*|*" $_chiave="*) continue ;;
        esac
        GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$_p"
    done
}

# L'avvio silenzioso con lo splash di Plymouth. loglevel e le due righe di udev
# tolgono i messaggi che passerebbero SOPRA lo splash.
skillfish_aggiungi quiet splash loglevel=3 rd.systemd.show_status=false \
                   rd.udev.log_level=3 udev.log_priority=3 \
                   vt.global_cursor_default=0 mitigations=off

# --- e adesso, solo se siamo davvero su una BC-250 --------------------------
# Il riconoscimento viene dal DMI, che su questa scheda dice "AMD BC-250".
if [ "$(cat /sys/devices/virtual/dmi/id/product_name 2>/dev/null)" = "AMD BC-250" ]; then
    # ttm.*: la memoria della GPU e' condivisa con la CPU e il valore di serie
    # lascia sul tavolo meta' della VRAM utilizzabile.
    # tsc=directsync: senza, l'orologio del kernel su questa scheda salta.
    # split_lock_detect=off: alcuni giochi ne fanno a bizzeffe e il kernel li
    # mette in pausa per punizione, con cali di frame visibili.
    skillfish_aggiungi split_lock_detect=off tsc=directsync \
                       ttm.pages_limit=3538944 ttm.page_pool_size=3538944

    # ⚠️ LO SBLOCCO DELLE 40 CU NON SI ACCENDE QUI, ED E' PIU' DI UNA SCELTA:
    # amdgpu.bc250_cc_write_mode non serve piu'. Lo stesso lavoro lo fa
    # skillfish-cu.service all'avvio scrivendo i registri, e quello si disfa
    # anche a caldo, mentre il parametro vuole un riavvio. Misurato sulla .32 il
    # 17/09/2026: tolto il parametro e riavviata, 40/40 CU lo stesso e 10169
    # GFLOPS contro i 10166 con il parametro.
    # Chi ce l'ha ancora nella sua riga di comando non ci guadagna niente, ma
    # questo file aggiunge e basta e non glielo toglie: a quello pensa
    # skillfish-clean-cmdline, e solo sulle macchine che BC-250 non sono.
fi


# --- la tabella ACPI delle frequenze CPU ------------------------------------
# Il firmware della BC-250 non dichiara nessun _PSS, quindi Linux non ha
# cpufreq: i core stanno intorno a 1400 MHz anche da fermi. La tabella la
# genera skillfish-acpi-pstates (in skillfish-base) e si carica come primo
# initrd. ⚠️ La riga si scrive solo se il file c'e' davvero: dichiarare un
# initrd che manca vuol dire un menu di avvio che non parte.
if [ -f /boot/SkillFishOS-acpi.cpio ]; then
    GRUB_EARLY_INITRD_LINUX_CUSTOM="SkillFishOS-acpi.cpio"
fi

# --- la riga di comando, ripulita dai doppioni -------------------------------
# ⚠️ Non li mettiamo noi. Il modulo grubcfg di Calamares aggiunge i suoi
# kernel_params a quello che trova senza guardare se ci sono gia': dopo
# un'installazione la riga usciva con `splash` due volte. Non fa danni, ma e'
# il genere di sciatteria che uno legge nel menu di avvio e si chiede cosa
# abbiamo combinato.
_pulita=
for _p in $GRUB_CMDLINE_LINUX_DEFAULT; do
    case " $_pulita " in
        *" $_p "*) continue ;;
    esac
    _pulita="${_pulita:+$_pulita }$_p"
done
GRUB_CMDLINE_LINUX_DEFAULT="$_pulita"
unset _pulita _p _chiave
