# Permanent user-visible encoded-audio frontend.
#
# This is a six-channel NULL sink. It NEVER opens hw:Generic,3 itself.
# WirePlumber dynamically attaches the hardware backend while the encoded
# output is selected:
#   * bc250_ac3  -> ALSA a52 -> AC-3 5.1 @ 640 kbps
#
# The normal HDMI/DP sink remains stock ACP and fully EDID/ELD-driven.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink

      # SteamOS exposes node.name in its output selector, so the name has to
      # read sensibly on its own. Bitrates are configurable, so they are
      # deliberately not part of the name or the description.
      node.name = "bc250_ac3"
      node.description = "Dolby Digital 5.1 (AC3)"
      node.nick = "Dolby Digital 5.1"
      media.class = "Audio/Sink"
      node.virtual = true

      # Keep processing silence while selected. The monitor bridge therefore
      # continues feeding valid AC-3 frames and TVs / soundbars / AVRs retain
      # their Dolby lock between application sounds.
      node.always-process = true
      node.pause-on-idle = false
      node.suspend-on-idle = false
      session.suspend-timeout-seconds = 0

      audio.rate = 48000
      audio.channels = 6
      audio.position = [ FL FR RL RR FC LFE ]

      # Native HDMI/DP must win automatic selection on a fresh state.
      priority.session = 100
      priority.driver = 1

      monitor.channel-volumes = true
      monitor.passthrough = true

      adapter.auto-port-config = {
        mode = dsp
        monitor = true
        position = preserve
      }
    }
  }
]
