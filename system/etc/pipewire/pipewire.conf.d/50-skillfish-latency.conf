# SkillFishOS: PipeWire quantum for games. 512 frames at 48 kHz is ~10.7 ms,
# half the stock 1024, still far from underruns on this CPU. Applications that
# ask for their own quantum (Steam, games through Proton) keep asking.
context.properties = {
    default.clock.rate        = 48000
    default.clock.quantum     = 512
    default.clock.min-quantum = 256
    default.clock.max-quantum = 2048
}
