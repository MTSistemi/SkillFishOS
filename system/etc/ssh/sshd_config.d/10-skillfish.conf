# SkillFishOS - accesso SSH
#
# PERCHE' ESISTE
# Su un'installazione fresca della 26.06.3-rc2 il collegamento SSH veniva
# rifiutato con "allowed types: ['publickey']": nessun modo di entrare con la
# password. La causa e' eggs, che in edit-live-fs.js cancella le righe
# PermitRootLogin e PasswordAuthentication da sshd_config e, quando
# ssh_pass e' false in eggs.yaml, ci scrive sopra:
#     PermitRootLogin prohibit-password
#     PasswordAuthentication no
#
# Questo file sta in sshd_config.d/, che viene incluso in cima a sshd_config:
# in OpenSSH vince la PRIMA occorrenza di una direttiva, quindi quello che c'e'
# qui batte cio' che eggs aggiunge in fondo. Ed eggs non tocca questa cartella,
# quindi la correzione sopravvive alla rigenerazione dell'immagine.

# L'utente entra con la sua password: e' quello che serve a chi installa il
# sistema su una macchina in casa e vuole raggiungerla da un altro PC.
PasswordAuthentication yes

# QUI NON SI TOCCA PermitRootLogin, ed e' una scelta.
# La prima versione di questo file ci scriveva "prohibit-password". Sembrava
# ragionevole - root+password su una porta 22 raggiungibile e' la combinazione
# che riempie i log di tentativi automatici - ma essendo il primo file incluso
# avrebbe vinto su TUTTO, compreso il "PermitRootLogin yes" scritto a mano
# nella sshd_config della scheda di sviluppo, che non ha nessuna chiave per
# root: al primo reload di sshd saremmo rimasti fuori.
#
# Non scrivendo la direttiva ottengono entrambi la cosa giusta senza eccezioni
# locali: sulla scheda vale il "yes" gia' presente in sshd_config, mentre nella
# ISO eggs quella riga la cancella e resta il default di OpenSSH, che e'
# prohibit-password. Chi installa ha quindi root solo con chiave e il proprio
# utente con password, che era l'obiettivo.
