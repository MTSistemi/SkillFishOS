# SkillFishOS: Mesa shader cache. The default cap is 1 GB, which a couple of
# big games fill and then evict each other's pipelines (long stutters on the
# first minutes of every session). 10 GB keeps them all; the cache lives in
# ~/.cache/mesa_shader_cache_db and can be deleted at any time.
MESA_SHADER_CACHE_MAX_SIZE=10G
