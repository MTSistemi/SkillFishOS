# The BC-250 carries an NCT6686 SuperIO. Two drivers can bind to it:
#  - nct6683 (mainline): read-only, CANNOT drive the fan PWM
#  - nct6687 (out-of-tree, DKMS): read+write, needed for fan control
# Loading both leaves the read-only one racing for the same chip and the fan
# stops responding to PWM writes, so blacklist the mainline one outright.
blacklist nct6683
options nct6687 force=1
