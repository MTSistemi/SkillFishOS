# SkillFishOS: the two settings zram needs, both counter-intuitive.
#
# page-cluster: the kernel reads swap in batches of 8 pages because on a disk
# the seek is what costs. zram has no seek and every page must be decompressed,
# so reading 8 to use 1 means seven decompressions thrown away. 0 = one page.
#
# swappiness: 60 assumes swapping is expensive. With zram it is cheap, and
# holding back means the kernel drops file cache instead - here that is the
# shader cache and the game assets.
vm.page-cluster = 0
vm.swappiness = 150
