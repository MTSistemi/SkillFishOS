# NTSYNC — primitive di sincronizzazione NT native per Wine/Proton.
#
# Il kernel SkillFishOS ha CONFIG_NTSYNC=m, ma senza questo file il modulo non
# viene MAI caricato: /dev/ntsync non esiste e Proton ripiega in silenzio su
# fsync/esync, che costano molto piu' in overhead di sincronizzazione.
# Il device nasce gia' con permessi 0666, quindi non serve alcuna regola udev.
ntsync
